<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내기게임 - 커피내기·점심내기·랜덤게임</title>
<meta name="description" content="친구, 회사, 모임에서 즐기는 무료 내기게임. 구슬레이스, 핀볼, 룰렛 등으로 커피내기, 점심내기, 벌칙과 순서를 재미있게 정해보세요.">
<meta name="keywords" content="내기게임, 커피내기, 점심내기, 구슬레이스, 핀볼내기, 랜덤게임, 랜덤뽑기, 벌칙게임">
<meta property="og:title" content="내기게임 - 재미있게 결정하는 랜덤게임">
<meta property="og:description" content="오늘 누가 커피 살까? 게임으로 재미있게 정해보세요.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2fb; --card:#ffffff; --ink:#1b2340; --muted:#56608a; --line:#cfd6ea;
  --accent:#ff4f7e; --field:#1a2352; --brass:#e8b53a;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a33; --card:#1d2548; --ink:#e9ecf8; --muted:#9aa3c7; --line:#2f3866; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{padding:28px 0 0}
.logo{font-family:"Jua",sans-serif;font-size:22px;text-decoration:none}
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(38px,6vw,60px);line-height:1.1;margin:0 0 16px}
.hero p{color:var(--muted);font-size:17px;margin:0 0 24px;max-width:34em}
.cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-family:"Jua",sans-serif;font-size:20px;padding:12px 26px;border-radius:14px}
.tube{background:var(--field);border-radius:24px;height:300px;position:relative;overflow:hidden}
.tube i{position:absolute;border-radius:50%;box-shadow:inset -5px -6px 0 rgba(0,0,0,.2),inset 5px 5px 0 rgba(255,255,255,.35);animation:drop 3.6s linear infinite}
.tube b{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--brass)}
@keyframes drop{from{transform:translateY(-60px)}to{transform:translateY(360px)}}
@media (prefers-reduced-motion: reduce){ .tube i{animation:none} }
h2{font-family:"Jua",sans-serif;font-weight:400;font-size:28px;margin:40px 0 16px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.game{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;display:block}
.game:hover{border-color:var(--ink)}
.game .em{font-size:34px}
.game h3{font-family:"Jua",sans-serif;font-weight:400;font-size:22px;margin:6px 0 4px}
.game p{margin:0;color:var(--muted)}
.soon{border-style:dashed;color:var(--muted)}
footer{padding:48px 0 36px;color:var(--muted);font-size:14px}
@media (max-width:720px){ .hero{grid-template-columns:1fr;padding-top:32px} .tube{height:200px} }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="./">🎲 내기게임</a></header>

  <section class="hero">
    <div>
      <h1>오늘 내기는<br>게임으로 정하자!</h1>
      <p>커피내기, 점심내기, 벌칙 정하기부터 순서 뽑기까지. 친구들과 간단하고 재미있는 랜덤 게임으로 결정해 보세요.</p>
      <a class="cta" href="marble-race.html">구슬레이스 내기 시작하기</a>
    </div>
    <div class="tube" aria-hidden="true" id="tube"></div>
  </section>

  <h2>게임 목록</h2>
  <div class="games">
    <a class="game" href="marble-race.html">
      <div class="em">🔮</div>
      <h3>구슬레이스 내기</h3>
      <p>커피내기부터 벌칙 정하기까지. 크기와 스킬이 다른 구슬들의 예측불가 레이스!</p>
    </a>
    <!-- ✏️ 새 게임을 만들면 위의 <a class="game"> 블록을 복사해서 여기에 붙여 넣으세요 -->
    <div class="game soon">
      <div class="em">🟡</div>
      <h3>핀볼내기 준비 중</h3>
      <p>공이 핀을 튕기며 내려오는 랜덤 핀볼 게임을 준비하고 있어요.</p>
    </div>
  </div>

  <!-- ✏️ 이름이나 연락처를 적어 주세요 -->
  <footer>© 2026 내기게임 · 친구와 함께 즐기는 무료 랜덤게임</footer>
</div>
<script>
// 첫 화면의 장식용 구슬
const tube = document.getElementById('tube');
const colors = ['#ff4f7e','#35c6d6','#e8b53a','#7c6cff','#3fd18a'];
for(let r=0;r<6;r++) for(let c=0;c<5;c++){
  const b = document.createElement('b');
  b.style.left = (12 + c*20 + (r%2)*10) + '%'; b.style.top = (10 + r*16) + '%';
  tube.appendChild(b);
}
for(let i=0;i<9;i++){
  const m = document.createElement('i'), s = 16 + Math.random()*22;
  Object.assign(m.style, {width:s+'px', height:s+'px', left:(8 + Math.random()*80)+'%', top:0,
    background: colors[i % colors.length], animationDelay: (-Math.random()*3.6)+'s',
    animationDuration: (2.6 + Math.random()*2)+'s'});
  tube.appendChild(m);
}
</script>
</body>
</html>
